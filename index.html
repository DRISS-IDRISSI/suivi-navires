<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Layout: sticky harbour-signage header, status strip, alerts, vessel cards in a wrapping grid, history chart + table last. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f5f7f8; --line:#d6dce1; --grid:#e4e8eb;
  --fg:#10202b; --fg-2:#4a5b67; --fg-3:#76858f;
  --accent:#0b5c6b; --accent-ink:#ffffff; --track:#dde3e7;
  --good:#12805c; --warn:#a86a00; --crit:#b3261e; --info:#245fa8;
  --good-bg:#e0f3ec; --warn-bg:#fbefd6; --crit-bg:#fbe3e1; --info-bg:#e1ebf8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d171d; --surface:#142129; --surface-2:#1a2a33; --line:#27394350; --grid:#223540;
  --fg:#e8eef2; --fg-2:#aebcc5; --fg-3:#7f909b;
  --accent:#4fb3c4; --accent-ink:#06222a; --track:#27394a;
  --good:#42c79b; --warn:#e0a63c; --crit:#f2877f; --info:#7ab0ee;
  --good-bg:#12332a; --warn-bg:#392d12; --crit-bg:#3d1c1a; --info-bg:#162a42;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171d; --surface:#142129; --surface-2:#1a2a33; --line:#27394350; --grid:#223540;
  --fg:#e8eef2; --fg-2:#aebcc5; --fg-3:#7f909b;
  --accent:#4fb3c4; --accent-ink:#06222a; --track:#27394a;
  --good:#42c79b; --warn:#e0a63c; --crit:#f2877f; --info:#7ab0ee;
  --good-bg:#12332a; --warn-bg:#392d12; --crit-bg:#3d1c1a; --info-bg:#162a42;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
.login{max-width:360px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:10px}
.login input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:8px 10px;min-height:38px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--fg);padding-block:12px;margin-bottom:16px}
.top-in{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.sub{color:var(--fg-2);font-size:13px;margin-top:4px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button,input[type=number]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:7px 10px;min-height:36px}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.drop{border:1.5px dashed var(--fg-3);border-radius:4px;padding:10px 14px;color:var(--fg-2);font-size:13px;margin-bottom:16px;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--surface-2)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);background:var(--surface);margin-bottom:16px}
.strip>div{padding:10px 14px;border-right:1px solid var(--line)}
.strip>div:last-child{border-right:0}
.strip .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.strip .v{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.1}
h2{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin:24px 0 10px;font-weight:600}
.alerts{display:flex;flex-direction:column;gap:6px}
.al{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:3px;border:1px solid var(--line);background:var(--surface)}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-crit{background:var(--crit-bg);color:var(--crit)}.p-info{background:var(--info-bg);color:var(--info)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;min-width:0}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.vn{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.vv{color:var(--fg-3);font-size:12px}
.pct{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1}
.bar{display:flex;height:14px;background:var(--track);border-radius:2px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;background:var(--accent)}
.bar-l{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px 14px;margin-top:14px}
.kv .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.kv .v{font-size:17px;font-weight:500}
.kv .grp{grid-column:1/-1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.tw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
td.r,th.r{text-align:right}
.gb{display:inline-block;height:6px;background:var(--accent);border-radius:1px;vertical-align:middle;margin-left:6px}
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 0;font-size:12px;color:var(--fg-2)}
.leg i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--fg-2);font-family:var(--f-body);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;font-size:12px;border-radius:3px;white-space:nowrap;z-index:3}
.empty{padding:36px 16px;text-align:center;color:var(--fg-2);background:var(--surface);border:1px solid var(--line);border-radius:4px}
.empty b{font-family:var(--f-display);font-size:22px;color:var(--fg);display:block;margin-bottom:6px;text-transform:uppercase}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:3px;z-index:9;max-width:90%}
.note{color:var(--fg-3);font-size:12px;margin-top:8px}
.est{margin-top:12px;padding:8px 10px;border:1px dashed var(--info);border-radius:3px;background:var(--info-bg);color:var(--info);font-size:13px}
.est b{font-weight:600}
.hm td.c{text-align:center;font-family:var(--f-mono);min-width:54px}
.hm .ok{background:var(--good-bg);color:var(--good)}.hm .low{background:var(--crit-bg);color:var(--crit)}.hm .chk{background:var(--warn-bg);color:var(--warn)}.hm .na{color:var(--fg-3)}
details.dt{margin-top:12px}details.dt>summary{cursor:pointer;color:var(--fg-2);font-size:13px}
.mb{display:inline-block;height:8px;border-radius:1px;vertical-align:middle;margin-left:6px;background:var(--accent)}
.mbw{display:inline-block;width:70px;height:8px;background:var(--track);border-radius:1px;vertical-align:middle;margin-left:8px;position:relative}
.mbw .mb{margin:0;position:absolute;left:0;top:0}

.tabs{display:flex;gap:6px;margin-top:12px}
.tabs button{font-family:var(--f-display);font-size:18px;letter-spacing:.05em;text-transform:uppercase;padding:6px 18px;font-weight:600}
.tabs button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.term{margin-bottom:18px}
.term h3{font-family:var(--f-display);font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px;display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap;font-weight:600}
.term h3 .vv{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:400}
.chip{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:2px 7px;border-radius:2px;margin:1px 4px 1px 0;background:var(--track);color:var(--fg-2)}
.chip.ok{background:var(--good-bg);color:var(--good)}.chip.low{background:var(--crit-bg);color:var(--crit)}.chip.chk{background:var(--warn-bg);color:var(--warn)}
.pb{display:inline-block;width:110px;height:10px;background:var(--track);border-radius:2px;vertical-align:middle;overflow:hidden;margin-right:8px}
.pb i{display:block;height:100%;background:var(--accent)}
.poste{cursor:pointer;min-width:84px;border-radius:2px}.poste:hover{background:var(--surface-2)}
.cat td{padding:5px 8px}.cat tr.nd td{color:var(--fg-3)}.cat tr.tot td{font-weight:600;border-top:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px}
.mx td{vertical-align:top}.mx td.g{background:var(--good-bg)}.mx td.w{background:var(--warn-bg)}.mx td.z{color:var(--fg-3)}
.mx tr.sub td{font-weight:600;background:var(--surface-2)}.mx td .vv{display:block;white-space:normal;max-width:150px}
.hint{font-size:12px;color:var(--fg-3)}
@media (max-width:640px){.pb{width:70px}.pct{font-size:32px}}
</style></head><body>
<div class="wrap">
<header class="top"><div class="top-in">
  <div><h1>Suivi des escales &middot; TC3</h1><div class="sub" id="sub">Aucun rapport charg&eacute;</div></div>
  <div class="ctrls">
    <label for="snapSel" class="sub" style="margin:0">Rapport</label>
    <select id="snapSel" aria-label="Choisir un rapport"></select>
    <button type="button" id="btnOut" hidden>Déconnexion</button>
    <button class="primary" id="btnImport" type="button">Importer un rapport</button>
    <button type="button" id="btnXlsx">Exporter Excel</button>
    <button type="button" id="btnPdf">Exporter PDF</button>
    <input id="file" type="file" accept=".xlsx,.xls" multiple hidden>
  </div>
</div>
<nav class="tabs" id="tabs" aria-label="Rubriques"><button type="button" data-tab="pilot">Pilotage</button><button type="button" data-tab="drv">Conducteurs</button><button type="button" data-tab="ana">Analyse</button></nav></header>

<div class="drop" id="drop">Import manuel (secours) : glissez ici le rapport horaire (REP_QUAY_CRANE_DELAYS&hellip;) ou le rapport de fin de shift (REP_MM_END_SHIFT&hellip;). En fonctionnement normal, les rapports arrivent seuls depuis la bo&icirc;te mail.</div>
<div id="app"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const TZ='Africa/Casablanca';
/* L'identifiant d'un rapport (AAAAMMJJHHMM) est l'heure locale du Maroc lue dans l'en-tete du fichier :
   on l'affiche telle quelle, sans dependre du fuseau ni de la base de fuseaux de l'ordinateur. */
const lt=s=>{const i=String(s.id);return Date.UTC(+i.slice(0,4),+i.slice(4,6)-1,+i.slice(6,8),+i.slice(8,10),+i.slice(10,12));};
const LT=(s,o)=>new Date(lt(s)).toLocaleString('fr-FR',{timeZone:'UTC',...o});
const fmt=(n,d=0)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SERIES=['--s1','--s2','--s3','--s4','--s5','--s6'];
let snaps=[], hours=[], sel=null, metric='rem', THR=10, IDLE_H=2, db=null;
let tab='pilot', dayKey=null, GT=20, meta={}, rtgs=[], drivers=[], drvKey=null, OBJ={rtg:15,sc:10}, SHF=40;

/* ---------- parsing ---------- */
function num(v){ if(typeof v==='number') return v; if(v==null) return null;
  const s=String(v).replace(/[\s  ]/g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?null:n; }
function parseTs(s){ const m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/); if(!m) return null;
  return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]); }
function parseWorkbook(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const R=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const row=(i,c)=>(R[i]||[])[c];
  const gen=parseTs(row(1,18)); if(!gen) throw new Error("Date du rapport introuvable (cellule S2).");
  const win=String(row(1,6)||''), shift=String(row(1,0)||'').trim();
  const vessels=[];
  for(let r=0;r<R.length;r++){
    if(String(row(r,0)).trim()!=='WORKING VESSEL') continue;
    const v={visit:String(row(r+2,0)).trim(),name:String(row(r+2,2)).trim(),phase:String(row(r+2,11)).trim(),
      imp:num(row(r+4,0)),expF:num(row(r+4,1)),expE:num(row(r+4,4)),restow:num(row(r+4,7)),shiftTotal:num(row(r+4,10)),acc:num(row(r+4,14)),
      remImp:num(row(r+6,0)),remF:num(row(r+6,2)),remE:num(row(r+6,5)),rem:num(row(r+6,9)),gmph:num(row(r+6,13)),cranes:[]};
    for(let k=r+8;k<R.length&&String(row(k,0)).trim()!==''&&String(row(k,0)).trim()!=='WORKING VESSEL'&&!String(row(k,0)).startsWith('Definitions');k++){
      v.cranes.push({id:String(row(k,0)).trim(),moves:num(row(k,3)),hours:num(row(k,8)),gmph:num(row(k,12)),src:String(row(k,17)).trim()});
    }
    if(v.visit) vessels.push(v);
  }
  if(!vessels.length) throw new Error("Aucun navire WORKING trouvé dans ce fichier.");
  const p=n=>String(n).padStart(2,'0');
  const id=''+gen.getFullYear()+p(gen.getMonth()+1)+p(gen.getDate())+p(gen.getHours())+p(gen.getMinutes());
  return {id,ts:gen.getTime(),shift,window:win,vessels};
}

/* rapport horaire REP_QUAY_CRANE_DELAYS (memes regles que la fonction ingest-report) */
function casaToUtc(y,mo,d,h,mi){
  const f=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'});
  const off=t=>{const p=f.formatToParts(new Date(t)),v=k=>+p.find(x=>x.type===k).value;return Date.UTC(v('year'),v('month')-1,v('day'),v('hour'),v('minute'))-t;};
  const g=Date.UTC(y,mo,d,h,mi); let t=g-off(g); t=g-off(t); return t; }
function isHourlyWb(wb){ return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}).some(l=>l.some(x=>/Hourly Quay-Crane/i.test(String(x)))); }
function parseHourly(wb){
  const R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  let wr=-1,hr=-1,tr=-1,gen='';
  R.forEach((r,i)=>{ const L=r.map(x=>String(x).trim());
    if(wr<0&&L.some(x=>/^Rolling window/i.test(x))) wr=i;
    if(tr<0&&L.some(x=>/^TOTAL VESSEL MOVES/i.test(x))) tr=i;
    if(hr<0&&L.includes('CRANE')&&L.includes('MOVES')) hr=i;
    const g=L.find(x=>/^Generated\s/i.test(x)); if(g) gen=g; });
  if(wr<0||hr<0) throw new Error('Structure du rapport horaire non reconnue.');
  const n=R[wr].filter(x=>typeof x==='number'); if(n.length<2) throw new Error('Fenêtre horaire introuvable.');
  const P=sv=>{const d=new Date(Math.round((sv-25569)*1440)*60000);return {y:d.getUTCFullYear(),mo:d.getUTCMonth(),d:d.getUTCDate(),h:d.getUTCHours(),mi:d.getUTCMinutes()};};
  const p2=x=>String(x).padStart(2,'0'), a=P(n[0]), b=P(n[1]);
  const idx=nm=>R[hr].findIndex(x=>String(x).trim()===nm), cC=idx('CRANE'),cM=idx('MOVES'),cS=idx('STATUS');
  let total=null,load=null,disch=null,other=null;
  if(tr>=0){ const lab=R[tr],val=R[tr+1]||[],at=re=>{const c=lab.findIndex(x=>re.test(String(x)));return c<0?null:num(val[c]);};
    total=at(/^TOTAL VESSEL MOVES/i);load=at(/^LOAD MOVES/i);disch=at(/^DISCHARGE MOVES/i);other=at(/^MISSING/i); }
  const txt=R.flat().map(String).find(x=>/Minimum:\s*\d+/i.test(x))||''; const min=+((txt.match(/Minimum:\s*(\d+)/i)||[])[1]||20);
  const cranes=[]; for(let k=hr+1;k<R.length;k++){ const c=String(R[k][cC]??'').trim(); if(!c||/\s/.test(c)) break; cranes.push({id:c,moves:num(R[k][cM])??0,status:String(R[k][cS]??'').trim()}); }
  if(!cranes.length) throw new Error('Aucune grue dans le rapport horaire.');
  return {id:`${b.y}${p2(b.mo+1)}${p2(b.d)}${p2(b.h)}${p2(b.mi)}`,ts:casaToUtc(b.y,b.mo,b.d,b.h,b.mi),from:`${p2(a.h)}:${p2(a.mi)}`,to:`${p2(b.h)}:${p2(b.mi)}`,min,total,load,disch,other,generated:gen.replace(/^Generated\s*/i,''),cranes};
}

/* rapport horaire RTG (REP_RTG_MOVES_HOURLY) : deux blocs RTG01-07 / RTG08-14 cote a cote (memes regles que ingest-report) */
function isRtgWb(wb){ return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}).some(l=>l.some(x=>/Hourly RTG Moves/i.test(String(x)))); }
function parseRtg(wb){
  const R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  let wr=-1,hr=-1,tr=-1,gen='';
  R.forEach((r,i)=>{ const L=r.map(x=>String(x).trim());
    if(wr<0&&L.some(x=>/^Rolling window/i.test(x))) wr=i;
    if(tr<0&&L.some(x=>/^TOTAL RTG EVENTS/i.test(x))) tr=i;
    if(hr<0&&L.includes('RTG')&&L.includes('MOVES')&&L.includes('STATUS')) hr=i;
    const g=L.find(x=>/^Generated\s/i.test(x)); if(g) gen=g; });
  if(wr<0||hr<0) throw new Error('Structure du rapport RTG non reconnue.');

  const H=R[hr].map(x=>String(x).trim()), cols=nm=>H.map((x,i)=>x===nm?i:-1).filter(i=>i>=0), cR=cols('RTG'),cM=cols('MOVES'),cS=cols('STATUS');
  const list=[]; for(let k=hr+1;k<R.length;k++){ let any=false; cR.forEach((c,j)=>{ const id=String(R[k][c]??'').trim(); if(/^RTG\w+$/i.test(id)){ any=true; list.push({id,moves:num(R[k][cM[j]])??0,status:String(R[k][cS[j]]??'').trim()}); } }); if(!any) break; }

  return {id:`${b.y}${p2(b.mo+1)}${p2(b.d)}${p2(b.h)}${p2(b.mi)}`,ts:casaToUtc(b.y,b.mo,b.d,b.h,b.mi),from:`${p2(a.h)}:${p2(a.mi)}`,to:`${p2(b.h)}:${p2(b.mi)}`,min,total,vessel,yard,gate,generated:gen.replace(/^Generated\s*/i,''),rtgs:list};
}

/* ---------- analysis ---------- */
const act=v=>v.cranes.filter(c=>c.moves>0);
function gm(v){ const a=act(v), h=a.reduce((s,c)=>s+(c.hours||0),0), m=a.reduce((s,c)=>s+c.moves,0); return h?m/h:null; }
const val=(v,k)=>k==='gmph'?gm(v):v[k];
const cur=()=>snaps.find(s=>s.id===sel);
const prevOf=s=>{ const i=snaps.indexOf(s); return i>0?snaps[i-1]:null; };
/* ---- mise a jour en continu : rapport de shift (base officielle) + mouvements des grues du navire dans les rapports horaires recus depuis ---- */
let LV=new WeakMap();
const ac=v=>{const l=LV.get(v);return l?l.acc:v.acc;}, rm=v=>{const l=LV.get(v);return l?l.rem:v.rem;};
function liveCalc(){
  LV=new WeakMap(); const s=lastSnap(); if(!s||!hours.length) return;
  const hs=hours.filter(h=>h.ts-HR>=s.ts-10*60000); if(!hs.length) return;
  const cv=craneVessel(s), upto=hs[hs.length-1], expected=Math.round((lt(upto)-Math.floor(lt(s)/HR)*HR)/HR), gaps=Math.max(0,expected-hs.length);
  s.vessels.forEach(v=>{ if(!(v.rem>0)) return; const ids=new Set(v.cranes.filter(c=>cv.get(c.id)===v).map(c=>c.id)); if(!ids.size) return;
    const mv=hs.reduce((a,h)=>a+h.cranes.filter(c=>ids.has(c.id)).reduce((x,c)=>x+(c.moves||0),0),0), tot=(v.acc||0)+(v.rem||0);
    const unreliable=mv>v.rem+10, rem=unreliable?v.rem:Math.max(0,v.rem-mv);
    const last=hs.slice(-2), rate=last.reduce((a,h)=>a+h.cranes.filter(c=>ids.has(c.id)).reduce((x,c)=>x+(c.moves||0),0),0)/last.length;
    LV.set(v,{mv,n:hs.length,gaps,upto,unreliable,rem,acc:unreliable?v.acc:tot-rem,rate}); });
}
const pct=v=>{ const t=(v.acc||0)+(v.rem||0); return t?100*ac(v)/t:null; };
function eta(v,s){ const L=LV.get(v), R=L&&!L.unreliable?L:null, rem=R?R.rem:v.rem, rate=R&&R.rate>0?R.rate:act(v).reduce((a,c)=>a+(c.gmph||0),0), base=R?lt(R.upto):lt(s);
  if(!rem) return {txt:R?'Terminé (estimé)':'Terminé',h:0}; if(!rate) return {txt:'—',h:null};
  const h=rem/rate, t=new Date(base+h*3600000), mm=Math.round(h*60);
  return {h,txt:'≈ '+(mm>=60?Math.floor(mm/60)+' h '+String(mm%60).padStart(2,'0'):mm+' min'),clock:t.toLocaleTimeString('fr-FR',{timeZone:'UTC',hour:'2-digit',minute:'2-digit'})}; }
function alertsFor(s){
  const out=[], p=prevOf(s);
  s.vessels.forEach(v=>{
    if(v.rem===0&&/WORKING/i.test(v.phase)) out.push(['info','Prêt à clôturer',`${v.name} : plus aucun mouvement restant, phase encore ${v.phase}. Confirmer la fin des opérations.`]);
    if(gm(v)!=null&&gm(v)<THR&&v.rem>0) out.push(['warn','GMPH faible',`${v.name} : ${fmt(gm(v),1)} GMPH global (seuil ${THR}).`]);
    if(p){ const pv=p.vessels.find(x=>x.visit===v.visit); if(pv&&v.rem>0&&pv.rem===v.rem&&pv.acc===v.acc) out.push(['crit','Aucune progression',`${v.name} : restant et cumulé inchangés depuis le rapport de ${LT(p,{hour:'2-digit',minute:'2-digit'})}.`]); }
  });
  if(s===lastSnap()) out.push(...hourlyAlerts());
  const rank={crit:0,warn:1,info:2}; return out.sort((a,b)=>rank[a[0]]-rank[b[0]]);
}


/* ---------- rapports horaires : grues, estimation, alertes ---------- */
const lastSnap=()=>snaps[snaps.length-1], lastHour=()=>hours[hours.length-1];
/* la fenetre horaire est-elle posterieure au dernier rapport de shift ? (sinon ses mouvements sont deja comptes dans ce rapport) */
const afterSnap=h=>{const l=lastSnap();return !!l&&h.ts-3600000>=l.ts-10*60000;};
const HR=3600000, craneVessel=sn=>{ const m=new Map(), sc=new Map(), l=sn||lastSnap(); /* une grue peut figurer sur 2 navires (ancien termine + nouveau) : on retient celui ou elle a le plus travaille, puis celui encore en cours */ if(l) l.vessels.forEach(v=>v.cranes.forEach(c=>{ const k=(c.moves||0)*1000+((v.rem||0)>0?1:0); if(!sc.has(c.id)||k>sc.get(c.id)){ sc.set(c.id,k); m.set(c.id,v); } })); return m; };
const stCls=st=>/LOW/i.test(st)?'low':/CHECK/i.test(st)?'chk':/OK/i.test(st)?'ok':'na';
const stPill=st=>/LOW/i.test(st)?'p-crit':/CHECK/i.test(st)?'p-warn':/OK/i.test(st)?'p-good':'p-info';
const stLab=st=>/LOW/i.test(st)?'Faible':/CHECK/i.test(st)?'À vérifier':/OK/i.test(st)?'OK':st;
const hTime=(h,o)=>LT(h,o||{hour:'2-digit',minute:'2-digit'});
/* estimation : restant du dernier rapport de shift - mouvements horaires des grues du navire depuis ce rapport */
function estimate(v,s){
  if(s!==lastSnap()||!hours.length||!(v.rem>0)) return null;
  const hs=hours.filter(h=>h.ts-HR>=s.ts-10*60000); if(!hs.length) return null;
  const ids=new Set(v.cranes.map(c=>c.id));
  const mv=hs.reduce((a,h)=>a+h.cranes.filter(c=>ids.has(c.id)).reduce((x,c)=>x+(c.moves||0),0),0);
  const rem=Math.max(0,(v.rem||0)-mv), tot=(v.acc||0)+(v.rem||0), acc=tot-rem;
  /* incoherent : les grues ont fait bien plus que le restant connu -> reaffectation ou travail ajoute, estimation non fiable */
  const unreliable=mv>(v.rem||0)+10;
  return {mv,rem,pct:tot?100*acc/tot:null,n:hs.length,upto:hs[hs.length-1],unreliable};
}
function hourlyAlerts(){
  const out=[], h=lastHour(); if(!h) return out;
  const age=(Date.now()-h.ts)/60000;
  if(age>100) out.push(['warn','Rapport horaire en retard',`Dernier rapport horaire reçu : ${hTime(h,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} (fenêtre ${h.from}–${h.to}), il y a ${Math.round(age/60)} h. Vérifier l'arrivée des e-mails.`]);
  const cv=craneVessel(), prev=hours[hours.length-2];
  h.cranes.forEach(c=>{
    const v=cv.get(c.id), working=v&&v.rem>10; /* navire presque termine : pas d'alerte d'arret */ if(!v) return; /* grue non affectée à un navire en cours : ignorée */
    const p=prev&&prev.cranes.find(x=>x.id===c.id), idle2=c.moves===0&&p&&p.moves===0;
    if(/LOW/i.test(c.status)&&(v.rem||0)>=(h.min||20)) out.push(['warn','Grue sous le minimum',`${c.id} (${v.name}) : ${c.moves} mouvements sur 60 min (minimum ${h.min}).`]);
    else if(/CHECK/i.test(c.status)&&working) out.push([idle2?'crit':'warn',idle2?'Grue à l\'arrêt':'Grue sans mouvement',`${c.id} (${v.name}) : 0 mouvement ${idle2?'depuis 2 heures':'sur la dernière heure'} alors qu'il reste ${fmt(v.rem)} mouvements. Confirmer l'affectation.`]);
  });
  /* grues qui travaillent alors que leur navire (dernier rapport de shift) est termine : probablement un autre navire */
  const by=new Map(); h.cranes.forEach(c=>{ const v=cv.get(c.id); if(v&&v.rem===0&&c.moves>0&&afterSnap(h)){ if(!by.has(v.name)) by.set(v.name,[]); by.get(v.name).push(c); } });
  by.forEach((cs,name)=>out.push(['info','Grues sur navire terminé',`${cs.map(c=>c.id+' ('+c.moves+')').join(', ')} : mouvements sur la dernière heure alors que ${name} est terminé au dernier rapport de shift. Probablement affectées à un autre navire, qui apparaîtra au prochain rapport de shift. Les mouvements ne lui sont pas attribués.`]));
  return out;
}
function hourlySection(){

  return `<h2>Dernière heure · grues <span class="vv" style="text-transform:none;letter-spacing:0">(fenêtre ${esc(h.from)} – ${esc(h.to)}, le ${hTime(h,{day:'2-digit',month:'2-digit'})})</span></h2>

}

/* ---------- escales (historique par escale, calcule a partir des rapports) ---------- */
function escales(){
  const last=snaps[snaps.length-1], m=new Map(), lastOfShift=new Map();
  snaps.forEach(s=>lastOfShift.set((s.window||'')+'|'+s.shift,s)); /* dernier rapport de chaque shift : evite de compter deux fois les mouvements cumules du shift */
  snaps.forEach(s=>s.vessels.forEach(v=>{
    let e=m.get(v.visit); if(!e){ e={visit:v.visit,name:v.name,first:lt(s),last:lt(s),acc:0,rem:null,mv:0,hrs:0,shifts:0}; m.set(v.visit,e); }
    e.name=v.name; e.last=lt(s); e.acc=v.acc; e.rem=v.rem;
  }));
  lastOfShift.forEach(s=>s.vessels.forEach(v=>{ const e=m.get(v.visit), a=act(v); if(!e||!a.length) return;
    e.shifts++; e.mv+=a.reduce((x,c)=>x+c.moves,0); e.hrs+=a.reduce((x,c)=>x+(c.hours||0),0); }));
  return [...m.values()].map(e=>{ const present=!!(last&&last.vessels.some(v=>v.visit===e.visit));
    return {...e,gmph:e.hrs?e.mv/e.hrs:null,present,statut:present?(e.rem===0?'À clôturer':'En cours'):(e.rem===0?'Terminée':'Sortie du rapport')}; })
    .sort((a,b)=>(b.present-a.present)||(b.last-a.last));
}
function escalesTable(){
  const L=escales(), cls={'En cours':'p-info','À clôturer':'p-warn','Terminée':'p-good','Sortie du rapport':'p-warn'};
  const d=t=>new Date(t).toLocaleString('fr-FR',{timeZone:'UTC',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

function parseDrivers(wb){
  const sheet=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}):[];
  const rows=n=>{ const R=sheet(n), h=R.findIndex(r=>String(r[0]).trim()==='TYPE_ENGIN'); if(h<0) return {R,out:[]};
    const H=R[h].map(x=>String(x).trim()), col=k=>H.indexOf(k), g=(r,k)=>{const v=r[col(k)]; return v===''||v==null?null:v;}, out=[];
    for(let k=h+1;k<R.length;k++){ const r=R[k]; if(!String(r[0]).trim()) continue;
      out.push({m:g(r,'MATRICULE'),n:g(r,'NOM'),p:g(r,'PRENOM'),l:g(r,'LOGIN'),e:g(r,'ENGIN'),li:g(r,'HEURE_LOGIN'),lo:g(r,'HEURE_LOGOUT'),dur:num(g(r,'DUREE_MIN')),st:g(r,'STATUT_SESSION'),ns:num(g(r,'NB_SESSIONS')),

    return {R,out}; };
  const a=rows('RTG'), b=rows('SC'), head=String((a.R[1]||[])[0]??(b.R[1]||[])[0]??'');
  const m=head.match(/SHIFT\s+(S\d)\s*>=\s*(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}).*?<\s*(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if(!m) throw new Error("En-tête du shift introuvable dans le rapport conducteurs.");
  return {id:`${m[4]}${m[3]}${m[2]}${m[1]}`,ts:casaToUtc(+m[9],+m[8]-1,+m[7],+m[10],+m[11]),shift:m[1],start:`${m[4]}-${m[3]}-${m[2]} ${m[5]}:${m[6]}`,end:`${m[9]}-${m[8]}-${m[7]} ${m[10]}:${m[11]}`,rtg:a.out,sc:b.out};
}
const dts=s=>{const m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/); return m?Date.UTC(+m[3],+m[2]-1,+m[1],+m[4],+m[5]):null;};
const hhmm=s=>{const m=String(s||'').match(/(\d{2}):(\d{2})/); return m?m[0]:'';};
const dur=min=>min==null?'—':Math.floor(min/60)+'h'+String(Math.round(min%60)).padStart(2,'0');
const tcase=s=>String(s||'').toLowerCase().replace(/(^|[\s-])(\p{L})/gu,(x,a,b)=>a+b.toUpperCase());
/* une ligne par (conducteur, engin) dans le rapport : on regroupe par identifiant de connexion */
function drvMerge(rows){
  const mp=new Map();
  rows.forEach(r=>{ const k=r.l||r.m||('?'+r.e); let o=mp.get(k);
    if(!o){ o={key:k,login:r.l,m:r.m,n:r.n,p:r.p,engs:[],li:null,lo:null,open:false,dur:0,in:0,out:0,move:0,shifting:0,disch:0,load:0,other:0,total:0,noSess:true}; mp.set(k,o); }
    if(r.e&&!o.engs.some(x=>x.e===r.e)) o.engs.push({e:r.e,t:0}); const eg=o.engs.find(x=>x.e===r.e); if(eg) eg.t+=r.total;
    ['in','out','move','shifting','disch','load','other','total'].forEach(f=>o[f]+=r[f]||0);
    const li=dts(r.li), lo=dts(r.lo); if(li!=null){ o.noSess=false; if(o.li==null||li<o.li) o.li=li; } if(lo!=null&&(o.lo==null||lo>o.lo)) o.lo=lo;
    if(/OPEN/i.test(r.st||'')) o.open=true; o.dur=Math.max(o.dur,r.dur||0); if(!o.m&&r.m) o.m=r.m; if(!o.n&&r.n) o.n=r.n; if(!o.p&&r.p) o.p=r.p; });
  return [...mp.values()].map(o=>{ o.engs.sort((a,b)=>b.t-a.t); o.h=o.dur/60; o.mph=o.dur>=60&&o.total>0?o.total/o.h:null; o.shp=o.total?o.shifting/o.total*100:0;
    o.name=o.n&&o.p?`${tcase(o.n)} ${tcase(o.p)}`:(o.n&&o.n!==o.login?tcase(o.n):(o.login||'—')); return o; });
}
function drvSection(title,rows,obj,kind,d){
  const L=drvMerge(rows), act=L.filter(o=>o.total>0).sort((a,b)=>b.total-a.total), idle=L.filter(o=>o.total===0&&!o.noSess).sort((a,b)=>b.dur-a.dur);
  const tot=act.reduce((a,o)=>a+o.total,0), hs=act.reduce((a,o)=>a+o.h,0), sh=act.reduce((a,o)=>a+o.shifting,0), mx=Math.max(1,...act.map(o=>o.total));

/* points d'attention pour le responsable */
function drvAlerts(d){
  const out=[];
  [['RTG',d.rtg,OBJ.rtg],['Cavaliers',d.sc,OBJ.sc]].forEach(([t,rows,obj])=>{
    const L=drvMerge(rows).filter(o=>o.total>0);
    L.filter(o=>o.mph!=null&&o.h>=2&&o.mph<obj*0.6).sort((a,b)=>a.mph-b.mph).forEach(o=>out.push(['warn',t,`${o.name} (${o.engs.map(g=>g.e).join(', ')}) : ${fmt(o.mph,1)} mvts/h sur ${dur(o.dur)} de connexion, objectif ${obj}/h.`]));
    L.filter(o=>o.shp>SHF&&o.total>=15).sort((a,b)=>b.shp-a.shp).forEach(o=>out.push(['info',t,`${o.name} (${o.engs.map(g=>g.e).join(', ')}) : ${fmt(o.shp)} % de shifting (${fmt(o.shifting)} sur ${fmt(o.total)} mouvements).`]));
    const idle=drvMerge(rows).filter(o=>o.total===0&&!o.noSess&&o.dur>=120); if(idle.length) out.push(['warn',t,`${idle.length} conducteur(s) connecté(s) plus de 2 h sans aucun mouvement : ${idle.map(o=>o.name+' ('+dur(o.dur)+')').join(', ')}.`]);
  });
  /* RTG ayant travaille mais absents du rapport horaire RTG sur ce shift (ex. RTG15/RTG16 non listes par le rapport horaire) */
  const a=dts(d.start.replace(/(\d{4})-(\d{2})-(\d{2})/,'$3/$2/$1')), b=dts(d.end.replace(/(\d{4})-(\d{2})-(\d{2})/,'$3/$2/$1'));
  const w=rtgs.filter(x=>lt(x)>a&&lt(x)<=b);
  if(w.length){ const seen=new Set(w.flatMap(x=>x.rtgs.map(r=>r.id))); const miss=[...new Set(d.rtg.filter(r=>r.total>0&&r.e&&!seen.has(r.e)).map(r=>r.e))];
    if(miss.length) out.push(['info','RTG',`${miss.join(', ')} ont travaillé sur ce shift mais ne figurent pas dans le rapport horaire RTG : leurs mouvements n'apparaissent donc pas dans le tableau « RTG heure par heure ». À signaler à l'IT.`]); }
  return out;
}

  <div class="alerts">${al.length?al.map(a=>`<div class="al"><span class="pill ${pcol[a[0]]}">${a[1]}</span><span>${esc(a[2])}</span></div>`).join(''):'<div class="al"><span class="pill p-good">RAS</span><span>Aucune anomalie détectée sur ce rapport.</span></div>'}</div>
  ${hourlySection()}
  ${rtgHeat()}
  <h2>Estimations en direct</h2>
  <div class="card" style="padding:12px 16px">${s.vessels.filter(v=>v.rem>0).map(v=>`<div style="margin:6px 0"><b>${esc(v.name)}</b> <span class="vv">restant au rapport de shift : ${fmt(v.rem)}</span><div style="margin-top:4px">${estHtml(v,s)}</div></div>`).join('')||'<span class="vv">Aucun navire en cours.</span>'}</div>
  ${s.vessels.some(v=>v.rem===0)?`<h2>Terminés · à clôturer dans N4</h2><div class="tw card" style="padding:8px 12px"><table><thead><tr><th>Navire</th><th>Escale</th><th>Phase N4</th><th class="r">Mouvements faits</th><th class="r">GMPH</th><th>Grues du shift</th></tr></thead><tbody>${s.vessels.filter(v=>v.rem===0).map(v=>`<tr><td><b>${esc(v.name)}</b></td><td class="num">${esc(v.visit)}</td><td><span class="pill p-warn">${esc(v.phase)}</span></td><td class="r num">${fmt(v.acc)}</td><td class="r num">${fmt(gm(v),1)}</td><td>${esc(act(v).map(c=>c.id).join(', ')||'—')}</td></tr>`).join('')}</tbody></table></div><p class="note">Restant à 0 mais phase toujours « WORKING » dans N4 : le rapport de shift continue de lister ces escales tant qu'elles ne sont pas clôturées dans N4. Une fois clôturées, elles disparaîtront du rapport.</p>`:''}
  ${escalesTable()}
  <h2>Historique</h2>
  <div class="ctrls" style="margin-bottom:10px">
    <div class="seg" role="group" aria-label="Indicateur">
      ${[['rem','Mouvements restants'],['acc','Cumulé'],['gmph','GMPH (postes actifs)']].map(([k,l])=>`<button type="button" data-m="${k}" aria-pressed="${metric===k}">${l}</button>`).join('')}
    </div>
    <label for="thr" class="sub" style="margin:0 0 0 8px">Seuil GMPH</label><input id="thr" type="number" min="0" max="60" value="${THR}" style="width:72px">
  </div>
  <div class="chart" id="chart"></div>
  <div class="tw card" style="padding:8px 12px"><table><thead><tr><th>Rapport</th><th>Shift</th>${vesselKeys().map(k=>`<th class="r">${esc(k.name)}<br>cumulé / restant</th>`).join('')}</tr></thead><tbody>
  ${snaps.slice().reverse().map(sn=>`<tr><td class="num">${LT(sn,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(sn.shift)}</td>${vesselKeys().map(k=>{const v=sn.vessels.find(x=>x.visit===k.visit);return `<td class="r num">${v?fmt(v.acc)+' / '+fmt(v.rem):'—'}</td>`}).join('')}</tr>`).join('')}
  </tbody></table></div>
  <p class="note">Avancement = cumulé / (cumulé + restant). L'heure de fin estimée applique le restant au GMPH cumulé des grues ayant travaillé : indicatif, hors aléas. L'avancement officiel vient des rapports de fin de shift (3 par jour) ; entre deux, l'estimation s'appuie sur les rapports horaires.</p>`;

  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{metric=b.dataset.m;render();});

}
function estHtml(v,s){
  const E=estimate(v,s); if(!E) return '<span class="vv">Pas de rapport horaire postérieur au rapport de shift.</span>';
  if(E.unreliable) return `<div class="est" style="margin-top:0;border-color:var(--warn);background:var(--warn-bg);color:var(--warn)"><b>Estimation non fiable</b> : les grues de ce navire ont fait ${fmt(E.mv)} mouvements depuis le rapport de shift de ${LT(s,{hour:'2-digit',minute:'2-digit'})} (rapports horaires jusqu'à ${esc(E.upto.to)}) pour ${fmt(v.rem)} restants à l'époque. Probable : grues réaffectées ou travail ajouté. Se fier au prochain rapport de shift.</div>`;
  return `<div class="est" style="margin-top:0">≈ <b>${fmt(E.rem)}</b> restant(s)${E.rem===0?' (terminé)':''} · ≈ ${E.pct==null?'—':fmt(E.pct,1)+' %'} d'avancement, soit −${fmt(E.mv)} mouvement(s) des grues du navire sur ${E.n} h depuis le rapport de shift de ${LT(s,{hour:'2-digit',minute:'2-digit'})} (heures jusqu'à ${esc(E.upto.to)}). Indicatif.</div>`;
}
function vesselKeys(){ const m=new Map(); snaps.forEach(s=>s.vessels.forEach(v=>{ if(!m.has(v.visit)) m.set(v.visit,{visit:v.visit,name:v.name}); })); return [...m.values()]; }

/* ---------- chart ---------- */
function drawChart(){
  const box=$('#chart'); const keys=vesselKeys(); const W=760,H=300,L=46,Rr=140,T=14,B=44;
  const lab={rem:'Mouvements restants',acc:'Mouvements cumulés',gmph:'GMPH global'}[metric];
  const pts=keys.map((k,i)=>({k,color:`var(${SERIES[i%SERIES.length]})`,p:snaps.map(s=>{const v=s.vessels.find(x=>x.visit===k.visit);return v&&val(v,metric)!=null?{t:s.ts,y:val(v,metric)}:null}).filter(Boolean)}));
  const all=pts.flatMap(x=>x.p); const ymax0=Math.max(1,...all.map(a=>a.y));
  const step=[1,2,5,10,20,50,100,200,500,1000,2000].find(st=>ymax0*1.08/st<=5)||5000; const ymax=Math.ceil(ymax0*1.05/step)*step;
  const t0=snaps[0].ts,t1=snaps[snaps.length-1].ts;
  const X=t=>t1===t0?L+(W-L-Rr)/2:L+(t-t0)/(t1-t0)*(W-L-Rr), Y=y=>T+(1-y/ymax)*(H-T-B);
  let g='';
  for(let y=0;y<=ymax;y+=step) g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--grid)"/><text x="${L-8}" y="${Y(y)+4}" text-anchor="end">${fmt(y)}</text>`;
  const every=Math.ceil(snaps.length/8);
  snaps.forEach((s,i)=>{ if(i%every===0) g+=`<text x="${X(s.ts)}" y="${H-8}" text-anchor="middle">${LT(s,{hour:'2-digit',minute:'2-digit'})}</text>`; });
  const placed=[];
  pts.forEach(sr=>{ if(!sr.p.length) return;
    const d=sr.p.map((a,i)=>(i?'L':'M')+X(a.t).toFixed(1)+' '+Y(a.y).toFixed(1)).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round"/>`;
    sr.p.forEach(a=>g+=`<circle cx="${X(a.t)}" cy="${Y(a.y)}" r="4" fill="${sr.color}" stroke="var(--surface)" stroke-width="2"/>`);
    const last=sr.p[sr.p.length-1]; let ly=Y(last.y)+4; while(placed.some(p=>Math.abs(p-ly)<13)) ly+=13; placed.push(ly);
    g+=`<text x="${X(last.t)+10}" y="${ly}" style="fill:var(--fg);font-weight:500">${esc(sr.k.name)}</text>`; });
  g+=`<line id="cx" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--fg-3)" stroke-dasharray="3 3" visibility="hidden"/>`;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${lab} par rapport">${g}<rect id="hit" x="${L}" y="${T}" width="${W-L-Rr}" height="${H-T-B}" fill="transparent"/></svg>
  <div class="leg">${pts.map(sr=>`<span><i style="background:${sr.color}"></i>${esc(sr.k.name)}</span>`).join('')}<span style="margin-left:auto">${lab}</span></div>
  ${snaps.length<2?'<div class="note">Un seul rapport pour l\'instant : importez le suivant pour voir les courbes évoluer.</div>':''}<div class="tip" hidden></div>`;
  const svg=box.querySelector('svg'), hit=box.querySelector('#hit'), cx=box.querySelector('#cx'), tip=box.querySelector('.tip');
  hit.addEventListener('mousemove',ev=>{ const r=svg.getBoundingClientRect(), sx=(ev.clientX-r.left)*W/r.width;
    let best=snaps[0]; snaps.forEach(s=>{ if(Math.abs(X(s.ts)-sx)<Math.abs(X(best.ts)-sx)) best=s; });
    cx.setAttribute('x1',X(best.ts)); cx.setAttribute('x2',X(best.ts)); cx.setAttribute('visibility','visible');
    tip.innerHTML=`<b>${LT(best,{hour:'2-digit',minute:'2-digit'})}</b><br>`+best.vessels.map(v=>`${esc(v.name)} : ${fmt(val(v,metric),metric==='gmph'?1:0)}`).join('<br>');
    tip.hidden=false; const br=box.getBoundingClientRect(); tip.style.left=Math.min(ev.clientX-br.left+14,br.width-170)+'px'; tip.style.top=(ev.clientY-br.top+10)+'px'; });
  hit.addEventListener('mouseleave',()=>{tip.hidden=true;cx.setAttribute('visibility','hidden');});
}


/* ---------- export ---------- */
function fmtP(n,d=0){ if(n==null||isNaN(n)) return '-'; const [i,f]=Number(n).toFixed(d).split('.'); const g=i.replace(/\B(?=(\d{3})+(?!\d))/g,' '); return f?g+','+f:g; }
function etaPlain(v,s){ const e=eta(v,s); return e.h==null?'-':e.h===0?'Termine':e.txt.replace('≈ ','~')+' ('+e.clock+')'; }
const stamp=s=>String(s.id).slice(0,8)+'_'+String(s.id).slice(8,12);
const when=ms=>new Date(ms).toLocaleString('fr-FR',{timeZone:'UTC',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(/[  ]/g,' ');
function saveFile(name,data){
  const type=name.endsWith('.pdf')?'application/pdf':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Fichier prêt : '+name);
}
function buildXlsx(s){
  const wb=XLSX.utils.book_new(), r1=v=>v==null?null:Math.round(v*10)/10;
  const syn=[['Navire','Escale','Terminal','Poste','Portiques affectés','Phase','Import shift','Export plein shift','Export vide shift','Restow shift','Total shift','Cumulé','Restant import','Restant export plein','Restant export vide','Restant total','Avancement %','GMPH (postes actifs)','Fin estimée']];
  s.vessels.forEach(v=>{ const p=pct(v); syn.push([v.name,v.visit,vTerms(v,s).join(' / '),poste(v),asg(v,s).join(', '),v.phase,v.imp,v.expF,v.expE,v.restow,v.shiftTotal,v.acc,v.remImp,v.remF,v.remE,v.rem,p==null?null:Math.round(p*10)/10,r1(gm(v)),etaPlain(v,s)]); });
  const w1=XLSX.utils.aoa_to_sheet([['Suivi des escales TC3 - rapport du '+when(lt(s))+' - '+s.shift+' - '+s.window],[],...syn]);
  w1['!cols']=[22,12,12,12,22,10,11,14,14,11,10,10,13,16,16,13,13,16,18].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,w1,'Synthèse');
  const cr=[['Navire','Grue','Mouvements shift','Heures brutes','GMPH']];
  s.vessels.forEach(v=>act(v).forEach(c=>cr.push([v.name,c.id,c.moves,c.hours,c.gmph])));
  const w2=XLSX.utils.aoa_to_sheet(cr); w2['!cols']=[22,10,16,14,10].map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,w2,'Grues actives');
  const hi=[['Rapport','Shift','Navire','Cumulé','Restant','GMPH (postes actifs)']];
  snaps.forEach(sn=>sn.vessels.forEach(v=>hi.push([when(lt(sn)),sn.shift,v.name,v.acc,v.rem,r1(gm(v))])));
  const w3=XLSX.utils.aoa_to_sheet(hi); w3['!cols']=[18,24,22,10,10,18].map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,w3,'Historique');
  const al=[['Niveau','Alerte']]; alertsFor(s).forEach(a=>al.push([a[0]==='crit'?'Critique':a[0]==='warn'?'Alerte':'Info',a[2]]));
  const w4=XLSX.utils.aoa_to_sheet(al); w4['!cols']=[{wch:10},{wch:100}]; XLSX.utils.book_append_sheet(wb,w4,'Alertes');
  const es=[['Navire','Escale','Statut','Premier rapport','Dernier rapport','Cumulé','Restant','GMPH moyen (postes actifs)','Shifts']];
  escales().forEach(e=>es.push([e.name,e.visit,e.statut,when(e.first),when(e.last),e.acc,e.rem,r1(e.gmph),e.shifts]));
  const w5=XLSX.utils.aoa_to_sheet(es); w5['!cols']=[22,12,18,18,18,10,10,22,8].map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,w5,'Escales');
  if(drivers.length){ const d=drivers.find(x=>x.id===drvKey)||drivers[drivers.length-1], dh=[['Shift','Type','Conducteur','Matricule','Login','Engin(s)','Connexion','Déconnexion','Connecté (min)','Total','Déch.','Charg.','IN','OUT','Parc','Shifting','Shifting %','Mvts/h']];
    [['RTG',d.rtg],['SC',d.sc]].forEach(([t,rows])=>drvMerge(rows).sort((a,b)=>b.total-a.total).forEach(o=>dh.push([d.shift+' '+d.start.slice(0,10),t,o.name,o.m||'',o.login||'',o.engs.map(g=>g.e).join(', '),o.li!=null?when(o.li):'',o.open?'en cours':o.lo!=null?when(o.lo):'',Math.round(o.dur),o.total,o.disch,o.load,o.in,o.out,o.move,o.shifting,Math.round(o.shp),o.mph==null?'':Math.round(o.mph*10)/10])));
    const wd=XLSX.utils.aoa_to_sheet(dh); wd['!cols']=[16,6,26,10,16,16,16,16,12,8,8,8,6,6,8,9,10,8].map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,wd,'Conducteurs'); }
  if(rtgs.length){ const rh=[['Fenêtre début','Fenêtre fin','RTG','Mouvements','Statut','Minimum/h']]; rtgs.forEach(g=>g.rtgs.forEach(r=>rh.push([when(lt(g)-HR),when(lt(g)),r.id,r.moves,r.status,g.min]))); const wr=XLSX.utils.aoa_to_sheet(rh); wr['!cols']=[18,18,8,12,16,10].map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,wr,'RTG horaires'); }
  { const days=[...new Set(snaps.map(dayOf).filter(Boolean))].sort(); const ds=dayKey&&days.includes(dayKey)?dayKey:days[days.length-1]; if(ds){ const wm=XLSX.utils.aoa_to_sheet([['Rendement des portiques par shift - journée du '+dayLab(ds)],[],...matrixAoa(ds)]); wm['!cols']=[10,10,9,9,26,9,9,26,9,9,26,12,12].map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,wm,'Rendement par shift'); } }
  if(hours.length){ const cv=craneVessel(), hh=[['Fenêtre début','Fenêtre fin','Grue','Navire (dernier rapport de shift)','Mouvements','Statut','Minimum/h']];
    hours.forEach(h=>h.cranes.forEach(c=>{const v=cv.get(c.id); hh.push([when(lt(h)-HR),when(lt(h)),c.id,v?(v.rem===0&&c.moves>0&&afterSnap(h)?v.name+' (terminé) - autre navire ?':v.name):'',c.moves,c.status,h.min]);}));
    const w6=XLSX.utils.aoa_to_sheet(hh); w6['!cols']=[18,18,8,26,12,16,10].map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,w6,'Grues horaires');
    const ht=[['Fenêtre début','Fenêtre fin','Total','Chargés','Déchargés','Autres']]; hours.forEach(h=>ht.push([when(lt(h)-HR),when(lt(h)),h.total,h.load,h.disch,h.other]));
    const w7=XLSX.utils.aoa_to_sheet(ht); w7['!cols']=[18,18,8,10,11,8].map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,w7,'Totaux horaires'); }
  return XLSX.write(wb,{type:'array',bookType:'xlsx'});
}
function buildPdf(s){
  const {jsPDF}=window.jspdf; const d=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const HEAD={fillColor:[11,92,107],textColor:255,fontSize:8.5}, BODY={fontSize:8.5,cellPadding:2};
  d.setFont('helvetica','bold'); d.setFontSize(18); d.text('SUIVI DES ESCALES - TC3',14,16);
  d.setFont('helvetica','normal'); d.setFontSize(10); d.setTextColor(80);
  d.text('Rapport du '+when(lt(s))+'  |  '+s.shift.replace(/\s+/g,' ')+'  |  '+s.window,14,22);
  const tot=s.vessels.reduce((a,v)=>({rem:a.rem+(v.rem||0),sh:a.sh+(v.shiftTotal||0)}),{rem:0,sh:0});
  d.text(s.vessels.length+' navires en cours  |  '+fmtP(tot.rem)+' mouvements restants  |  '+fmtP(tot.sh)+' mouvements sur le shift',14,28);
  d.setTextColor(0);
  d.autoTable({startY:33,head:[['Navire','Escale','Poste','Portiques','Phase','Cumulé','Restant','Rest. imp.','Rest. exp. plein','Rest. exp. vide','Total shift','GMPH','Avancement','Fin estimée']],
    body:s.vessels.map(v=>{const p=pct(v);return [v.name,v.visit,poste(v)||'-',asg(v,s).join(' ')||'-',v.phase,fmtP(v.acc),fmtP(v.rem),fmtP(v.remImp),fmtP(v.remF),fmtP(v.remE),fmtP(v.shiftTotal),fmtP(gm(v),1),p==null?'-':fmtP(p,1)+' %',etaPlain(v,s)];}),
    headStyles:HEAD,styles:BODY,columnStyles:{5:{halign:'right'},6:{halign:'right'},7:{halign:'right'},8:{halign:'right'},9:{halign:'right'},10:{halign:'right'},11:{cellWidth:30,valign:'top',cellPadding:{top:2,bottom:6,left:2,right:2}}},
    didDrawCell:data=>{ if(data.section==='body'&&data.column.index===11){ const v=s.vessels[data.row.index],p=pct(v)||0,x=data.cell.x+2,y=data.cell.y+data.cell.height-3.2,w=data.cell.width-4;
      d.setFillColor(215,222,226); d.rect(x,y,w,1.8,'F'); d.setFillColor(11,92,107); d.rect(x,y,w*p/100,1.8,'F'); } }});
  let y=d.lastAutoTable.finalY+8; d.setFont('helvetica','bold'); d.setFontSize(11); d.text('Grues actives (postes à 0 mouvement ignorés)',14,y);
  const rows=[]; s.vessels.forEach(v=>act(v).forEach(c=>rows.push([v.name,c.id,fmtP(c.moves),fmtP(c.hours,2),fmtP(c.gmph,1)])));
  d.autoTable({startY:y+3,head:[['Navire','Grue','Mouvements','Heures brutes','GMPH']],body:rows,headStyles:HEAD,styles:BODY,tableWidth:150,columnStyles:{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}});
  if(hours.length){ const h=lastHour(), cv=craneVessel(); y=d.lastAutoTable.finalY+8; if(y>150){d.addPage();y=16;}
    d.setFont('helvetica','bold'); d.setFontSize(11); d.text('Dernière heure ('+h.from+' - '+h.to+') : '+fmtP(h.total)+' mouvements ('+fmtP(h.load)+' charges, '+fmtP(h.disch)+' decharges)',14,y);
    d.autoTable({startY:y+3,head:[['Grue','Navire','Mvts / 60 min','Statut']],body:h.cranes.map(c=>{const v=cv.get(c.id);return [c.id,v?(v.rem===0&&c.moves>0&&afterSnap(h)?v.name+' (termine) - autre navire ?':v.name):'non affectee',fmtP(c.moves),stLab(c.status).replace('À','A')];}),headStyles:HEAD,styles:BODY,tableWidth:150,columnStyles:{2:{halign:'right'}}}); }
  const al=alertsFor(s); y=d.lastAutoTable.finalY+8; if(y>180){d.addPage();y=16;}
  d.setFont('helvetica','bold'); d.setFontSize(11); d.text('Alertes',14,y);
  d.autoTable({startY:y+3,head:[['Niveau','Alerte']],body:al.length?al.map(a=>[a[0]==='crit'?'Critique':a[0]==='warn'?'Alerte':'Info',a[2]]):[['RAS','Aucune anomalie détectée.']],headStyles:HEAD,styles:BODY,columnStyles:{0:{cellWidth:24},1:{cellWidth:'auto'}}});
  if(snaps.length>1){ const keys=vesselKeys(); d.addPage(); d.setFont('helvetica','bold'); d.setFontSize(11); d.text('Historique (cumulé / restant)',14,16);
    d.autoTable({startY:19,head:[['Rapport','Shift',...keys.map(k=>k.name)]],body:snaps.slice().reverse().map(sn=>[when(lt(sn)),sn.shift.replace(/\s+/g,' '),...keys.map(k=>{const v=sn.vessels.find(x=>x.visit===k.visit);return v?fmtP(v.acc)+' / '+fmtP(v.rem):'-';})]),headStyles:HEAD,styles:BODY}); }
  const n=d.getNumberOfPages(); for(let i=1;i<=n;i++){ d.setPage(i); d.setFontSize(8); d.setTextColor(120); d.text('Marsa Maroc - TC3 - page '+i+'/'+n,14,205); }
  return d.output('arraybuffer');
}
